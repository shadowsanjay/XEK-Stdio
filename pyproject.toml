[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xek-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "cryptography>=44,<47", "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2", "pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "imageio-ffmpeg>=0.6,<1", "ruff>=0.11,<1"]
speech = ["torch>=2.5", "transformers>=4.46,<5", "parler-tts>=0.2", "soundfile>=0.13", "sentencepiece>=0.2"]
transcription = ["faster-whisper>=1.1,<2"]
setup = ["psutil>=6,<8", "huggingface-hub>=0.28,<1", "static-ffmpeg>=3,<4"]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"] # FastAPI dependencies intentionally use callable defaults.
